name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - latest
  pull_request:
    branches:
      - main
      - latest
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # Required for OIDC-based Azure login
  packages: write   # Required for publishing to GitHub Container Registry

env:
  DOTNET_VERSION: '8.x'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}-server

jobs:
  # ─────────────────────────────────────────────────────────────
  # Job 1: Build and test the .NET server
  # ─────────────────────────────────────────────────────────────
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:latest
        env:
          POSTGRES_USER: user
          POSTGRES_DB: tailwind
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Apply database schema
        env:
          PGHOST: localhost
          PGUSER: user
        run: psql -d tailwind -f db/db.sql --quiet

      - name: Restore dependencies
        run: dotnet restore server/Tailwind.Mail.csproj

      - name: Build
        run: dotnet build server/Tailwind.Mail.csproj --configuration Debug --no-restore

      - name: Run tests
        working-directory: server
        env:
          ASPNETCORE_ENVIRONMENT: Development
          DATABASE_URL: "Host=localhost;Database=tailwind;Username=user;"
        run: dotnet test --configuration Debug --no-build --verbosity normal

  # ─────────────────────────────────────────────────────────────
  # Job 2: Build and push Docker image for the server
  # Runs only on pushes to main/latest (not on PRs)
  # ─────────────────────────────────────────────────────────────
  build-and-push-image:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/latest')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/latest' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: server
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # ─────────────────────────────────────────────────────────────
  # Job 3: Deploy to Azure App Service
  # Runs only on pushes to main/latest (not on PRs)
  # ─────────────────────────────────────────────────────────────
  deploy-to-azure:
    name: Deploy to Azure App Service
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/latest')
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Publish .NET application
        run: |
          dotnet publish server/Tailwind.Mail.csproj \
            --configuration Release \
            --output ./publish

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME }}
          package: ./publish
