name: Build and publish mail-server container image

on:
  push:
    branches: ['main', 'latest']
    paths:
      - 'server/**'
  workflow_dispatch:
    inputs:
      push_image:
        description: 'Push image to ACR'
        required: false
        default: 'true'
        type: boolean

env:
  IMAGE_NAME: tailwind-mail-server

permissions:
  id-token: write   # Required for OIDC login to Azure
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    environment: build
    outputs:
      image_tag: ${{ steps.meta.outputs.version }}
      acr_login_server: ${{ steps.acr_login.outputs.acr_login_server }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Get ACR login server
        id: acr_login
        run: |
          ACR_LOGIN_SERVER=$(az acr show \
            --name ${{ secrets.AZURE_ACR_NAME }} \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --query loginServer \
            --output tsv)
          echo "acr_login_server=${ACR_LOGIN_SERVER}" >> "$GITHUB_OUTPUT"

      - name: Log in to Azure Container Registry
        run: az acr login --name ${{ secrets.AZURE_ACR_NAME }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.acr_login.outputs.acr_login_server }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: server
          file: server/Dockerfile
          push: ${{ github.event_name != 'workflow_dispatch' || inputs.push_image == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Trigger staging deployment after a successful image build on the default branch
  trigger-staging-deploy:
    needs: build-and-push
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/latest'
    uses: ./.github/workflows/deploy-aks-staging.yaml
    with:
      image_tag: ${{ needs.build-and-push.outputs.image_tag }}
      acr_login_server: ${{ needs.build-and-push.outputs.acr_login_server }}
    secrets: inherit
