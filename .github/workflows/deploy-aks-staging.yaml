name: Deploy to Staging (AKS)

on:
  workflow_call:
    inputs:
      image_tag:
        description: 'Container image tag to deploy'
        required: true
        type: string
      acr_login_server:
        description: 'ACR login server hostname'
        required: true
        type: string
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Container image tag to deploy (e.g. sha-abc1234)'
        required: true
        type: string

env:
  IMAGE_NAME: tailwind-mail-server
  ENVIRONMENT: staging
  KUSTOMIZE_OVERLAY: deploy/k8s/overlays/staging

permissions:
  id-token: write
  contents: read

jobs:
  deploy-staging:
    name: Deploy to staging
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://tailwind-mail-staging.example.com

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Get AKS credentials
        run: |
          az aks get-credentials \
            --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
            --name "${{ secrets.AZURE_AKS_CLUSTER_NAME_STAGING }}" \
            --overwrite-existing

      - name: Install kubectl
        uses: azure/setup-kubectl@v3

      - name: Install kustomize
        uses: imranismail/setup-kustomize@v2

      - name: Resolve ACR login server
        id: resolve_acr
        run: |
          # Use the passed-in server when called from build workflow; fall back to secrets
          ACR_SERVER="${{ inputs.acr_login_server }}"
          if [ -z "$ACR_SERVER" ]; then
            ACR_SERVER=$(az acr show \
              --name "${{ secrets.AZURE_ACR_NAME }}" \
              --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
              --query loginServer --output tsv)
          fi
          echo "acr_login_server=${ACR_SERVER}" >> "$GITHUB_OUTPUT"

      - name: Set image in kustomize overlay
        working-directory: ${{ env.KUSTOMIZE_OVERLAY }}
        run: |
          kustomize edit set image \
            tailwind-mail-server=${{ steps.resolve_acr.outputs.acr_login_server }}/${{ env.IMAGE_NAME }}:${{ inputs.image_tag }}

      - name: Create namespace (idempotent)
        run: kubectl apply -f deploy/k8s/base/namespace.yaml

      - name: Create / update app secrets
        run: |
          kubectl create secret generic tailwind-mail-secrets \
            --namespace tailwind-mail \
            --from-literal=DATABASE_URL="${{ secrets.DATABASE_URL }}" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Render and validate manifests
        run: kustomize build ${{ env.KUSTOMIZE_OVERLAY }} | kubectl apply --dry-run=server -f -

      - name: Apply manifests
        run: kustomize build ${{ env.KUSTOMIZE_OVERLAY }} | kubectl apply -f -

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/tailwind-mail \
            --namespace tailwind-mail \
            --timeout 5m

      - name: Print deployment summary
        run: |
          echo "### Staging deployment complete 🚀" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Field | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Image | ${{ steps.resolve_acr.outputs.acr_login_server }}/${{ env.IMAGE_NAME }}:${{ inputs.image_tag }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Cluster | ${{ secrets.AZURE_AKS_CLUSTER_NAME_STAGING }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Namespace | tailwind-mail |" >> "$GITHUB_STEP_SUMMARY"
          kubectl get pods -n tailwind-mail
