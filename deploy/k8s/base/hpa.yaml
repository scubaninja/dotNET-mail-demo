apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: tailwind-mail
  namespace: tailwind-mail
  labels:
    app.kubernetes.io/name: tailwind-mail
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: tailwind-mail
  minReplicas: 1
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
